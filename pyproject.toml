# pyproject.toml
[build-system]
requires = ["hatchling", "Cython>=3.0.0", "setuptools>=60.0.0"]
build-backend = "hatchling.build"

[project]
name = "dxf-object-segregator"
version = "0.1.0"
description = "DXF entity segregation and object tree construction"
authors = [{name = "Your Name", email = "your.email@example.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.2.0",
    "PyQt6>=6.6.0",
    "numpy>=1.26.0",
    "jsonschema>=4.20.0",
    "pytest>=8.0.0",
    "hypothesis>=6.90.0",
    "pytest-qt>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1.0",
    "black>=23.3.0",
    "mypy>=1.2.0",
    "pylint>=2.17.0",
    "ipython>=8.12.0",
]
benchmark = [
    "pytest-benchmark>=4.0.0",
    "memory-profiler>=0.61.0",
]
ui-dev = [
    "pyqt6-tools>=6.5.0",
    "qtconsole>=5.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "src/scripts/build_cython.py"